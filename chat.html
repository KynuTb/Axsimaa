<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axsima</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/chat.css"><link rel="stylesheet" href="css/user-menu.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body class="app-body is-guest"><aside class="sidebar" id="sidebar"><a class="brand" href="index.html"><b>✦</b>Axsima</a><div data-auth-only hidden><button class="new-chat" id="newChat"><span>＋</span> Новый чат <kbd>⌘ K</kbd></button><div class="chat-search"><span>⌕</span><input aria-label="Поиск чатов" placeholder="Поиск"></div><div class="history"><p>СЕГОДНЯ</p><button class="history-item active">Стратегия запуска продукта <i>•••</i></button><button class="history-item">React: архитектура приложения</button><button class="history-item">Идеи для визуальной кампании</button><p>НА ЭТОЙ НЕДЕЛЕ</p><button class="history-item">Как работает RAG?</button></div></div><div class="guest-side-note" data-guest-only>Войдите, чтобы сохранять свои диалоги и управлять профилем.</div><div class="sidebar-bottom" id="userArea"></div></aside>
<main class="chat-main"><header class="app-header"><button class="mobile-menu" id="sidebarToggle">☰</button><div><strong>Новый диалог</strong><span>Axsima Core <b>⌄</b></span></div></header><section class="conversation" id="conversation"><div class="chat-content"><div class="assistant-message intro-message"><div class="assistant-avatar">✦</div><div><h1>Добрый вечер.</h1><p>С чего начнём сегодня?</p></div></div><div class="suggestion-grid" id="suggestions"><button><span>◈</span><b>Создать стратегию</b><small>для запуска нового продукта</small></button><button><span>⌘</span><b>Разобраться с кодом</b><small>и найти оптимальное решение</small></button><button><span>✎</span><b>Написать текст</b><small>с нужным тоном и структурой</small></button><button><span>◎</span><b>Исследовать тему</b><small>и увидеть важные связи</small></button></div></div></section><form class="composer-wrap" id="composer"><div class="composer"><textarea id="messageInput" rows="1" placeholder="Сообщение Axsima..." aria-label="Сообщение Axsima"></textarea><div class="composer-actions"><button type="button" title="Прикрепить файл" class="attach">＋</button><div class="model-select">✦ Axsima Core <span>⌄</span></div><button class="send" id="sendButton" type="submit" aria-label="Отправить">↑</button></div></div><p>Axsima может ошибаться. Проверяйте важную информацию.</p></form></main><script type="module" src="js/sidebar.js"></script><script src="js/chat.js"></script></body></html>
