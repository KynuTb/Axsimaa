<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройки — Axsima</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/chat.css"><link rel="stylesheet" href="css/profile.css"><link rel="stylesheet" href="css/user-menu.css"><link rel="stylesheet" href="css/responsive.css"></head><body class="app-body"><aside class="sidebar settings-side" id="sidebar"><a class="brand" href="index.html"><b>✦</b>Axsima</a><a class="back-link" href="chat.html">← Вернуться в чат</a><nav class="settings-nav"><a class="active" href="#profile">Профиль</a><a href="#appearance">Оформление</a></nav><div class="sidebar-bottom" id="userArea"></div></aside><main class="settings-main"><header><span class="eyebrow"><span></span> Аккаунт</span><h1>Настройки профиля</h1><p>Обновляйте личные данные — изменения сразу появятся во всём интерфейсе.</p></header><section id="profile" class="setting-section settings-profile"><form id="profileForm"><div class="avatar-editor"><label class="avatar-picker" for="avatarInput"><span id="avatarPreview"></span><span class="avatar-edit">Изменить</span></label><input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><div><strong>Аватар</strong><small>PNG, JPG или WebP до 2 МБ</small></div></div><div class="profile-fields"><label>Имя <em>*</em><input name="firstName" autocomplete="given-name" maxlength="60" required></label><label>Фамилия <span>необязательно</span><input name="lastName" autocomplete="family-name" maxlength="60"></label><label>Возраст <em>*</em><input name="age" type="number" min="1" max="150" required></label><label>Email <span>только просмотр</span><input id="emailReadonly" type="email" readonly></label></div><p class="profile-error" data-profile-error hidden role="alert"></p><p class="profile-success" data-profile-success hidden></p><button class="profile-save" type="submit">Сохранить изменения <span>→</span></button></form></section><section id="appearance" class="setting-section"><h2>Оформление</h2><p>Тёмная тема уже включена для комфортной работы.</p></section></main><script type="module">import { requireAuth } from './js/auth.js'; import { initProfileForm } from './js/profile-form.js'; import { renderUserMenu } from './js/user-ui.js'; const state = await requireAuth(); if (state) { document.querySelector('#emailReadonly').value = state.user.email; const area = document.querySelector('#userArea'); renderUserMenu(area, state); initProfileForm({ ...state, redirectOnSave: false }); document.addEventListener('profile:updated', (event) => renderUserMenu(area, event.detail)); }</script></body></html>
