<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль — Axsima</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/profile.css"><link rel="stylesheet" href="css/user-menu.css"></head><body class="profile-page"><main class="profile-shell"><a class="brand" href="chat.html"><b>✦</b>Axsima</a><section class="profile-panel"><a class="back-to-chat" href="chat.html">← К чатам</a><div class="profile-heading"><span class="eyebrow"><span></span> Личное пространство</span><h1 id="profileTitle">Расскажите о себе</h1><p id="profileSubtitle"></p></div><form id="profileForm"><div class="avatar-editor"><label class="avatar-picker" for="avatarInput"><span id="avatarPreview"></span><span class="avatar-edit">Изменить</span></label><input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><div><strong>Фото профиля</strong><small>PNG, JPG или WebP до 2 МБ</small></div></div><div class="profile-fields"><label>Имя <em>*</em><input name="firstName" autocomplete="given-name" maxlength="60" required></label><label>Фамилия <span>необязательно</span><input name="lastName" autocomplete="family-name" maxlength="60"></label><label>Возраст <em>*</em><input name="age" type="number" min="1" max="150" required></label></div><p class="profile-error" data-profile-error hidden role="alert"></p><p class="profile-success" data-profile-success hidden></p><button class="profile-save" type="submit">Сохранить профиль <span>→</span></button></form></section></main><script type="module" src="js/profile.js"></script></body></html>
